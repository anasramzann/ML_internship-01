<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlyRank Search Intelligence Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #F8FAFC;
      color: #0F172A;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      max-width: 600px;
      padding: 40px 20px;
    }
    .monogram {
      background-color: #2563EB;
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 800;
      display: inline-block;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 16px;
      line-height: 1.2;
    }
    p {
      color: #334155;
      font-size: 1.05rem;
      line-height: 1.6;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="monogram">FR / ML TRACK</div>
    <h1>Search Intelligence & ML Portfolio</h1>
    <p>I build machine learning pipelines that turn raw search and user engagement data into prioritized, evidence-backed editorial refresh queues.</p>
  </div>
</body>
</html>
